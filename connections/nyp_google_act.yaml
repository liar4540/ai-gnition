# Send + calendar-write access. Attached ONLY to tools/nyp_executor.py (hard rule 1).
# Key-value entries: client_id, client_secret, refresh_token (gmail.send + calendar.events).
# Values are set with scripts/setup_connections.ps1 from .env, never stored here.
# Get the refresh token once with: venv\Scripts\python scripts\get_google_refresh_token.py act
spec_version: v1
kind: connection
app_id: nyp_google_act
environments:
  draft:
    security_scheme: key_value_creds
    type: team
  live:
    security_scheme: key_value_creds
    type: team
