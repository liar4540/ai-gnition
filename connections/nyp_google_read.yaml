# Read-only Google access for every tool except the executor.
# Key-value entries: client_id, client_secret, refresh_token (gmail.readonly + calendar.readonly).
# Values are set with scripts/setup_connections.ps1 from .env, never stored here.
# Get the refresh token once with: venv\Scripts\python scripts\get_google_refresh_token.py read
spec_version: v1
kind: connection
app_id: nyp_google_read
environments:
  draft:
    security_scheme: key_value_creds
    type: team
